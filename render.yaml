databases:
  - name: issuetracker-db
    databaseName: disaster_management
    plan: free

services:
  # Backend Service
  - type: web
    name: issuetracker-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: issuetracker-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: issuetracker-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: issuetracker-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ALLOWED_ORIGINS
        value: https://issuetracker-frontend.onrender.com
      - key: TWILIO_ACCOUNT_SID
        value: ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      - key: TWILIO_AUTH_TOKEN
        value: your_twilio_token_here
      - key: TWILIO_PHONE_NUMBER
        value: +1234567890
      - key: TWILIO_WHATSAPP_NUMBER
        value: whatsapp:+1234567890
    healthCheckPath: /actuator/health

  # Frontend Service
  - type: web
    name: issuetracker-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: https://issuetracker-backend.onrender.com/api
      - key: VITE_WS_URL
        value: wss://issuetracker-backend.onrender.com/ws
