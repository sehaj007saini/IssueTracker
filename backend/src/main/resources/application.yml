spring:
  application:
    name: india-local-problems-os
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:Disaster_Management}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:laknight07}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    database-platform: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_schema: public
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB
  
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Application Configuration
app:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-this-in-production-min-256-bits-long}
    expiration-ms: 86400000  # 24 hours
  
  file-storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    max-file-size: 5242880  # 5MB in bytes
    allowed-extensions: jpg,jpeg,png,heic
  
  duplicate-detection:
    distance-threshold-meters: 50.0
    similarity-threshold: 0.70
  
  verification:
    min-verifications-required: 1
    approval-threshold: 0.60
  
  # SMS/WhatsApp Configuration (Twilio)
  sms:
    enabled: ${SMS_ENABLED:false}
    provider: twilio
    
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:your_account_sid_here}
    auth-token: ${TWILIO_AUTH_TOKEN:your_auth_token_here}
    phone-number: ${TWILIO_PHONE_NUMBER:+1234567890}
    whatsapp-number: ${TWILIO_WHATSAPP_NUMBER:whatsapp:+1234567890}
    enabled: ${TWILIO_ENABLED:false}
  
  otp:
    enabled: ${OTP_ENABLED:true}
    length: 6
    expiry-minutes: 10
    max-attempts: 3

# Logging
logging:
  level:
    com.localproblems.os: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
